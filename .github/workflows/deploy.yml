name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build
        run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/"

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          # deploy-pages caps its timeout at 10 minutes; the full book can take longer to sync.
          script: |
            const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
            const read = async (request, pendingDeployment = false) => {
              for (let attempt = 0; ; attempt++) {
                try { return await request(); }
                catch (error) {
                  if (attempt >= 4 || (error.status && error.status !== 429 && error.status < 500 && !(pendingDeployment && error.status === 404))) throw error;
                  core.warning(`GitHub read failed; retrying (${attempt + 1}/4).`);
                  await delay(Math.min(1000 * 2 ** attempt, 10000));
                }
              }
            };
            const { data } = await read(() => github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo, run_id: context.runId, per_page: 100, request: { timeout: 30000 }
            }));
            const artifacts = data.artifacts.filter(item => item.name === 'github-pages' && !item.expired);
            if (artifacts.length !== 1) throw new Error('Expected one current-run github-pages artifact.');
            const idToken = await core.getIDToken();
            core.setSecret(idToken);
            // A creation request is sent once: retrying an ambiguous response could create another deployment.
            const created = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo, artifact_id: artifacts[0].id, pages_build_version: context.sha,
              oidc_token: idToken, request: { timeout: 30000 }
            });
            const deploymentId = created.data.id || created.data.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('GitHub did not return a Pages deployment ID.');
            const deadline = Date.now() + 20 * 60 * 1000;
            const failed = new Set(['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            while (Date.now() < deadline) {
              const result = await read(() => github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                ...context.repo, deploymentId, request: { timeout: 30000 }
              }), true);
              core.info(`Pages deployment ${deploymentId}: ${result.data.status}`);
              if (result.data.status === 'succeed') {
                core.setOutput('page_url', created.data.page_url);
                return;
              }
              if (failed.has(result.data.status)) throw new Error(`Pages deployment failed: ${result.data.status}`);
              await delay(10000);
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {
              ...context.repo, deploymentId, request: { timeout: 30000 }
            });
            throw new Error('Pages deployment did not finish within 20 minutes and was cancelled.');
