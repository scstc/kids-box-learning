name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install dependencies
        run: npm ci
      - name: Test learning content
        run: npm test
      - name: Build and sync local web assets
        run: npm run android:sync
      - name: Build APK
        run: |
          chmod +x android/gradlew
          # GitHub's Gradle release download returns 504; use a mirror with Gradle's published SHA-256.
          sed -i -e 's#services.gradle.org/distributions/#repo.huaweicloud.com/gradle/#' -e 's/-all.zip/-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          printf '\ndistributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531\n' >> android/gradle/wrapper/gradle-wrapper.properties
          npm run android:build
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-box-learning-debug
          path: downloads/kids-box-learning-debug.apk
          if-no-files-found: error
          retention-days: 30
